
name: Telegram Bot Test

on:

  workflow_dispatch:

jobs:

  test-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Send Telegram message

        env:

          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

          CHAT_ID: ${{ secrets.CHAT_ID }}

        run: |

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \

            -d chat_id="${CHAT_ID}" \

            --data-urlencode "text=✅
