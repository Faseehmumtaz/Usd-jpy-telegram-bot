
name: Telegram Bot Test

on:

  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Send Telegram message

        env:

          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          python3 -c "import os,urllib.request,urllib.parse; u='https://api.telegram.org/bot'+os.environ['TOKEN']+'/sendMessage'; d=urllib.parse.urlencode({'chat_id':os.environ['CHAT_ID'],'text':'✅ Bot working successfully!'}).encode(); print(urllib.request.urlopen(urllib.request.Request(u,data=d),timeout=30).read().decode())"
